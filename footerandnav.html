<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyKumpanya</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    nav {
      background: #111827;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #D9EFBD;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #2BBBD7;
    }

    /* MAIN / HERO */
    main {
      flex: 1;
      padding: 3rem 2rem;
      background: #f8fafc;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3rem;
    }

    .hero-text {
      flex: 1;
    }

    .hero-text h1 {
      font-size: 3rem;
      color: #111827;
      margin-bottom: 1rem;
    }

    .hero-text p {
      font-size: 1.2rem;
      color: #4b5563;
      margin-bottom: 1.5rem;
    }

    .apply-btn {
      display: inline-block;
      background: #2BBBD7;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .apply-btn:hover {
      background: #199bb5;
    }

    /* PHOTO */
    .hero-image {
      flex: 1;
    }

    .hero-image img {
      width: 100%;
      max-width: 500px;
      height: 350px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    /* FOOTER */
    footer {
      background: #111827;
      color: #d1d5db;
      padding: 2rem;
    }

    .footer-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 2rem;
    }

    .footer-section {
      flex: 1;
    }

    .footer-section h3 {
      color: white;
      margin-bottom: 0.75rem;
    }

    .footer-section ul {
      list-style: none;
    }

    .footer-section li {
      margin-bottom: 0.5rem;
    }

    .footer-section a {
      color: #d1d5db;
      text-decoration: none;
    }

    .footer-section a:hover {
      color: #2BBBD7;
    }

    .copyright {
      text-align: center;
      border-top: 1px solid #374151;
      margin-top: 2rem;
      padding-top: 1rem;
      font-size: 0.9rem;
    }

   
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 1rem;
      }

      .nav-links {
        gap: 1rem;
      }

      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-text h1 {
        font-size: 2.2rem;
      }

      .hero-image img {
        height: 250px;
      }

      .footer-content {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="#" class="logo">MyKumpanya</a>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

 
  <main>
    <section class="hero">

      <div class="hero-text">
        <h1>Apply Na Sa MyKumpanya</h1>
        <p>Negosyo Mo. Pangarap Mo.</p>

        <a href="#" class="apply-btn">Apply Now</a>
      </div>

      <div class="hero-image">
        <img 
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6P4qijsl2dmXU4aVA4iXUIgVBBQ8jKekeniix5A7EXw&s=10" 
          alt="MyKumpanya Business"
        >
      </div>

    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-content">

      <div class="footer-section">
        <h3>MyKumpanya</h3>
        <p>Negosyo Mo, Pangarap Mo.</p>
      </div>

      <div class="footer-section">
        <h3>Links</h3>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
        </ul>
      </div>

      <div class="footer-section">
        <h3>Contact</h3>
        <ul>
          <li><a href="mailto:hello@example.com">Email</a></li>
          <li><a href="#">Facebook</a></li>
          <li><a href="#">Instagram</a></li>
        </ul>
      </div>

    </div>

    <div class="copyright">
      &copy; 2026 MyKumpanya. All rights reserved.
    </div>
  </footer>

</body>
</html>
