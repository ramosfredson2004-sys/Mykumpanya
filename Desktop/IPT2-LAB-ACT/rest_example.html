<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST Example (User)</title>
</head>
<body>
    <h1>REST EXAMPLE (User)</h1>
    
    <form id="dataForm">
        <label for="IdInput">Enter ID:</label>
        <input type="text" id="IdInput" placeholder="Enter 10">
        <button type="submit">Fetch Data</button>
    </form>
    
    <br>
    <textarea id="printOutput" readonly style="width: 508px; height: 308px;" placeholder="Output will appear here"></textarea>

    <script>
        const form = document.getElementById('dataForm');
        const output = document.getElementById('printOutput');

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const id = document.getElementById('IdInput').value.trim();
            if (!id) {
                output.value = "Please enter an ID.";
                return;
            }

            try {
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`);
                if (!response.ok) throw new Error("User not found");

                const data = await response.json();
                output.value = JSON.stringify(data, null, 4); 
            } catch (error) {
                output.value = `Error: ${error.message}`;
            } 
        });
    </script>
</body>
</html>
